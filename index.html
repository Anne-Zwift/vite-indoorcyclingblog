<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indoor Cycling Blog</title>
    <script>
      const isDark =
        localStorage.theme === 'dark' ||
        (!('theme' in localStorage) &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);

      if (isDark) {
        document.documentElement.classList.add('dark');
      }
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          document.body.classList.add('transition-colors', 'duration-500');
        }, 100);
      });
    </script>
  </head>
  <!-- remove the bg-color in body later? -->
  <body
    class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 duration-500 min-h-screen"
  >
    <div id="app" class="flex flex-col min-h-screen">
      <h1
        class="w-full text-center text-lg font-medium font-mono text-h1-text mt-9 md:text-2xl shrink-0"
        id="h1"
      >
        Indoor Cycling Blog
      </h1>
      <div
        class="bg-white/80 dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 sticky top-0 z-40 backdrop-blur-md w-full justify-items-center text-center px-4 shadow-sm"
        id="nav-container"
      ></div>
      <main
        class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 my-8"
        id="content-area"
      ></main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
